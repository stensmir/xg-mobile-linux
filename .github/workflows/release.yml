name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so we can read the annotated tag body
          # below. Default depth=1 doesn't include tag annotations.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check recovery safeguards
        run: |
          python3 tests/test_recovery.py
          bash -n decky-plugin/XG-Mobile/scripts/xgm-auto
          bash -n decky-plugin/XG-Mobile/scripts/xgm-shutdown
          bash -n decky-plugin/XG-Mobile/scripts/xgm-patch-nvidia

      - name: Install plugin frontend deps
        working-directory: decky-plugin/XG-Mobile
        run: npm install

      - name: Build dist
        working-directory: decky-plugin/XG-Mobile
        run: |
          npx tsc --noEmit
          npm run build

      - name: Package plugin tarball
        run: |
          # Decky expects: tarball whose top-level entry is the plugin folder
          # (XG-Mobile/), containing plugin.json, main.py, dist/, scripts/, systemd/.
          # node_modules are NOT shipped — backend runs main.py directly,
          # the built dist/index.js is what the frontend loads.
          cd decky-plugin
          tar --exclude='XG-Mobile/node_modules' \
              --exclude='*/__pycache__' \
              --exclude='*.pyc' \
              --exclude='*/.DS_Store' \
              --exclude='XG-Mobile/src' \
              --exclude='XG-Mobile/rollup.config.js' \
              --exclude='XG-Mobile/tsconfig.json' \
              --exclude='XG-Mobile/package-lock.json' \
              -czf ../XG-Mobile.tar.gz XG-Mobile
          cd ..
          ls -la XG-Mobile.tar.gz
          echo "--- contents ---"
          tar -tzf XG-Mobile.tar.gz | head -30

      - name: Extract release notes from tag annotation
        # Use the annotated tag body as the release description. Falls back
        # to autogenerated notes if the tag is lightweight (no message).
        id: tag_body
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ -z "$tag" ]] && [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          fi
          body=$(git for-each-ref "refs/tags/$tag" --format='%(contents)' 2>/dev/null | sed -e 's/^-----BEGIN PGP SIGNATURE-----.*//s' || true)
          if [[ -n "$body" ]]; then
            echo "$body" > /tmp/release_body.md
            echo "have_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: XG-Mobile.tar.gz
          body_path: ${{ steps.tag_body.outputs.have_body == 'true' && '/tmp/release_body.md' || '' }}
          generate_release_notes: ${{ steps.tag_body.outputs.have_body != 'true' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
